<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dispatch — Live Routing Council</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="data:," />
<style>
  /* Dispatch-specific components. The topbar, buttons, dropzone, results-panel,
     spinner and run-log come from styles.css (the themed shell); everything
     below is new and uses adaptive neutral colors so it reads on any theme. */
  .council-row { display: flex; flex-wrap: wrap; gap: .6rem; margin: 1rem 0; }
  .team-chip { display: flex; flex-direction: column; gap: .15rem; padding: .6rem .8rem;
    border: 1px solid rgba(128,128,128,.28); border-radius: 12px; background: rgba(128,128,128,.06);
    min-width: 150px; max-width: 230px; }
  .team-emoji { font-size: 1.3rem; line-height: 1; }
  .team-name { font-weight: 600; font-size: .9rem; }
  .team-bias { font-size: .72rem; opacity: .7; line-height: 1.3; }

  .text-input { width: 100%; min-height: 90px; margin: .5rem 0; padding: .6rem .7rem; border-radius: 10px;
    border: 1px solid rgba(128,128,128,.3); background: rgba(128,128,128,.04); color: inherit;
    font: inherit; resize: vertical; box-sizing: border-box; }
  .intake-actions { display: flex; gap: .5rem; align-items: center; }
  .label-input { flex: 1; padding: .45rem .6rem; border-radius: 8px; border: 1px solid rgba(128,128,128,.3);
    background: rgba(128,128,128,.04); color: inherit; font: inherit; }

  .gate-badge { font-size: .78rem; font-weight: 600; padding: .2rem .6rem; border-radius: 999px; }
  .gate-ok { background: rgba(34,197,94,.15); color: #16a34a; }
  .gate-warn { background: rgba(234,179,8,.16); color: #b45309; }
  .gate-unknown { background: rgba(128,128,128,.15); opacity: .8; }

  .decision-panel { margin: 1rem 0; padding: 1.1rem 1.2rem; border: 1px solid rgba(99,102,241,.4);
    border-radius: 16px; background: rgba(99,102,241,.06); }
  .decision-grid { display: flex; flex-wrap: wrap; gap: 1.4rem; margin-bottom: .8rem; }
  .decision-field { display: flex; flex-direction: column; gap: .2rem; }
  .df-label { font-size: .68rem; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; opacity: .6; }
  .df-value { font-size: .95rem; }
  .df-value.owner { font-weight: 700; }
  .chip { display: inline-block; padding: .12rem .5rem; border-radius: 999px; background: rgba(128,128,128,.16); font-size: .8rem; }
  .disp { display: inline-block; padding: .12rem .55rem; border-radius: 999px; font-size: .78rem; font-weight: 600; background: rgba(128,128,128,.16); }
  .disp-proceed-as-is { background: rgba(34,197,94,.16); color: #16a34a; }
  .disp-reshape { background: rgba(59,130,246,.16); color: #2563eb; }
  .disp-split { background: rgba(168,85,247,.16); color: #9333ea; }
  .disp-defer { background: rgba(234,179,8,.16); color: #b45309; }
  .disp-decline-and-redirect { background: rgba(239,68,68,.14); color: #dc2626; }

  .plan-block { margin: .6rem 0; }
  .deliverables { display: flex; flex-direction: column; gap: .5rem; margin-top: .4rem; }
  .deliverable { padding: .55rem .7rem; border: 1px solid rgba(128,128,128,.24); border-radius: 10px; background: rgba(128,128,128,.05); }
  .deliv-what { font-weight: 600; font-size: .9rem; }
  .deliv-meta { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .25rem; font-size: .76rem; opacity: .85; }
  .reuse-chip { padding: .05rem .4rem; border-radius: 999px; background: rgba(59,130,246,.14); color: #2563eb; }
  .next-action { margin-top: .7rem; font-size: .9rem; }

  .positions-heading { margin: 1.2rem 0 .5rem; font-size: 1rem; }
  .positions-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: .7rem; }
  .position-card { padding: .7rem .8rem; border: 1px solid rgba(128,128,128,.24); border-left-width: 4px;
    border-radius: 10px; background: rgba(128,128,128,.05); }
  .position-card.interest-in { border-left-color: #16a34a; }
  .position-card.interest-support { border-left-color: #2563eb; }
  .position-card.interest-out { border-left-color: rgba(128,128,128,.5); opacity: .82; }
  .pos-head { display: flex; justify-content: space-between; align-items: baseline; gap: .4rem; }
  .pos-team { font-weight: 600; font-size: .86rem; }
  .pos-interest { font-size: .74rem; white-space: nowrap; }
  .pos-deliverable, .pos-reuse { font-size: .8rem; margin-top: .3rem; }
  .pos-reuse { color: #2563eb; }
  .pos-rationale { font-size: .82rem; opacity: .82; margin-top: .35rem; font-style: italic; }
  .pos-foot { display: flex; justify-content: space-between; align-items: center; gap: .4rem; margin-top: .45rem; font-size: .74rem; opacity: .8; }
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <div>
        <h1>Dispatch</h1>
        <p class="subtitle">Route a skilling request · room seated from <code id="council-path">council/*.json</code></p>
      </div>
    </div>
    <div class="topbar-right">
      <span id="council-status" class="council-status">loading room…</span>
      <button id="refresh-council" class="btn btn-ghost" title="Re-read council/*.json">↻ Reload room</button>
    </div>
  </header>

  <main>
    <section class="council-row" id="council-row" aria-label="Seated teams"></section>

    <div class="intake-row">
      <section class="convene-panel">
        <div class="dropzone" id="dropzone">
          <div class="dropzone-inner">
            <div class="dropzone-icon">📨</div>
            <p><strong>Drop a request</strong> for the room to route</p>
            <p class="dropzone-or">— or paste it —</p>
            <textarea id="text-input" class="text-input" placeholder="Paste a skilling request, or a rough idea for one…"></textarea>
            <div class="intake-actions">
              <input id="label-input" type="text" class="label-input" placeholder="Label (optional)" />
              <button id="dispatch-text-btn" class="btn btn-primary">Dispatch it</button>
            </div>
            <input id="file-input" type="file" hidden />
            <button id="browse-btn" class="btn btn-secondary btn-sm">Browse a file…</button>
          </div>
        </div>
      </section>
    </div>

    <section class="results-panel" id="results-panel" hidden>
      <div class="results-header">
        <h2 id="results-heading">Dispatching…</h2>
        <span id="gate-badge" class="gate-badge" hidden></span>
      </div>
      <div class="run-meta">
        <span class="spinner" id="run-spinner"></span>
        <span id="run-status-text"></span>
        <button id="toggle-log" class="btn btn-ghost btn-sm" hidden>Show deliberation log</button>
      </div>
      <pre id="run-log" class="run-log" hidden></pre>

      <div id="decision-panel" class="decision-panel" hidden></div>
      <div id="debate" class="disagreement" hidden></div>
      <div class="act-row" id="act-row" hidden>
        <button id="act-btn" class="btn btn-secondary btn-sm" title="Not wired yet — a build path. Wire POST /api/dispatch/:id/act in server.js to open a work item, post to a channel, or route to the owner.">📤 Act on this decision <span class="build-flag">not wired</span></button>
        <span id="act-status" class="submit-status"></span>
      </div>
      <h3 class="positions-heading" id="positions-heading" hidden>How each team weighed in</h3>
      <div id="positions" class="positions-grid"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
