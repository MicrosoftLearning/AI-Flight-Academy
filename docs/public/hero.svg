<svg width="360" height="360" viewBox="0 0 360 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Flight Academy">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0f1e4d"/>
    </linearGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#f97316" stop-opacity="0"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="wing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dbeafe"/>
    </linearGradient>
  </defs>

  <circle cx="180" cy="180" r="168" fill="url(#sky)"/>

  <!-- horizon glow -->
  <path d="M12 236 a168 168 0 0 0 336 0 z" fill="#1d4ed8" opacity="0.45"/>
  <ellipse cx="180" cy="238" rx="132" ry="20" fill="#f97316" opacity="0.28"/>

  <!-- climb trail -->
  <path d="M52 300 C118 292 176 250 224 176" stroke="url(#trail)" stroke-width="9"
        stroke-linecap="round" stroke-dasharray="2 26" fill="none"/>

  <!-- roundel -->
  <circle cx="180" cy="168" r="104" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.28"/>
  <circle cx="180" cy="168" r="84" fill="none" stroke="#f97316" stroke-width="7"/>

  <!-- aircraft, climbing out -->
  <g transform="rotate(-38 180 168)">
    <path d="M180 92 c10 0 15.5 13.5 16.5 33 l41 25.5 v16.5 l-41 -12 v28 l14.5 12 v12 l-31 -8.5 l-31 8.5 v-12 l14.5 -12 v-28 l-41 12 v-16.5 l41 -25.5 c1 -19.5 6.5 -33 16.5 -33 z"
          fill="url(#wing)"/>
  </g>

  <!-- speed marks -->
  <g stroke="#f97316" stroke-width="8" stroke-linecap="round" opacity="0.9">
    <path d="M243 260 h54"/>
    <path d="M228 282 h40"/>
    <path d="M213 304 h26"/>
  </g>
</svg>
